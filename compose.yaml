services:
  app:
    build:
      context: .
      args:
        TALLY_GIT_COMMIT: ${TALLY_GIT_COMMIT:-}
    init: true
    environment:
      TALLY_DATA_DIR: /data
      TALLY_INSTANCE_NAME: ${TALLY_INSTANCE_NAME:-}
      TALLY_MONEY_PRECISION: ${TALLY_MONEY_PRECISION:-whole}
      TALLY_AUTH_ENABLED: ${TALLY_AUTH_ENABLED:-1}
      TALLY_IMPORT_HISTORY_ENABLED: ${TALLY_IMPORT_HISTORY_ENABLED:-1}
      TZ: Europe/Amsterdam
    volumes:
      - tally-data:/data
      - tally-backups:/backups
volumes:
  tally-data:
  tally-backups:
