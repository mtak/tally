services:
  app:
    build: .
    init: true
    environment:
      TALLY_DATA_DIR: /data
      TALLY_INSTANCE_NAME: ${TALLY_INSTANCE_NAME:-}
      TALLY_AUTH_ENABLED: ${TALLY_AUTH_ENABLED:-1}
      TZ: Europe/Amsterdam
    volumes:
      - tally-data:/data
      - tally-backups:/backups
volumes:
  tally-data:
  tally-backups:
