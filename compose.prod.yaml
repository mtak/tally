services:
  app:
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${TALLY_HOST:?Set TALLY_HOST}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${TALLY_HOST}
      TALLY_TRUST_PROXY: "1"
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}
      traefik.http.routers.tally.rule: Host("${TALLY_HOST}")
      traefik.http.routers.tally.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.tally.tls: "true"
      traefik.http.services.tally.loadbalancer.server.port: "8000"
networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
